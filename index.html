<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organic Engine</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
  <style>
    :root {
      --bg: #0b1111;
      --panel: #121c1c;
      --teal: #00f5d4;
      --text: #eafcfb;
      --muted: #899;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #engine {
      width: 90vw;
      height: 85vh;
      background: var(--panel);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 10px;
      box-shadow: 0 0 30px rgba(0, 245, 212, 0.1);
    }
    h1 {
      margin: 0;
      font-size: 1.8rem;
      color: var(--teal);
      text-align: center;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 1rem 0;
    }
    button {
      background: transparent;
      border: 1px solid var(--teal);
      color: var(--teal);
      border-radius: var(--radius);
      padding: 8px 18px;
      cursor: pointer;
      transition: 0.2s ease;
      font-size: 0.9rem;
    }
    button:hover { background: var(--teal); color: var(--bg); }
    .panel {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(0,245,212,0.2);
      border-radius: var(--radius);
      padding: 15px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .panel.active {
      display: flex;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .slider {
      width: 100%;
    }
    canvas {
      flex: 1;
      width: 100%;
      border-radius: var(--radius);
      background: #081010;
    }
  </style>
</head>
<body>
  <div id="engine">
    <h1>Organic Engine</h1>
    <div class="controls">
      <button id="startBtn">Start Audio</button>
      <button data-panel="lfo">LFO</button>
      <button data-panel="sequencer">Sequencer</button>
      <button data-panel="randomizer">Randomizer</button>
    </div>

    <canvas id="visual"></canvas>

    <div id="lfo" class="panel">
      <h2>Bio-LFO</h2>
      <label>Rate <input id="lfoRate" type="range" class="slider" min="0.1" max="20" value="2" step="0.1"></label>
      <label>Depth <input id="lfoDepth" type="range" class="slider" min="0" max="1" value="0.5" step="0.01"></label>
    </div>

    <div id="sequencer" class="panel">
      <h2>Mutation Sequencer</h2>
      <button id="mutateSeq">Mutate Pattern</button>
    </div>

    <div id="randomizer" class="panel">
      <h2>Random Patch Generator</h2>
      <button id="randomize">Randomize All</button>
    </div>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    let synth, lfo, seq;

    const canvas = document.getElementById('visual');
    const c = canvas.getContext('2d');
    function resizeCanvas() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Panels
    document.querySelectorAll('[data-panel]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.panel;
        document.querySelectorAll('.panel').forEach(p => {
          p.classList.toggle('active', p.id === id && !p.classList.contains('active'));
        });
      });
    });

    // Start Audio
    startBtn.addEventListener('click', async () => {
      await Tone.start();
      synth = new Tone.Synth().toDestination();
      lfo = new Tone.LFO(2, 200, 800).connect(synth.frequency).start();
      seq = new Tone.Sequence((time, note) => {
        synth.triggerAttackRelease(note, "8n", time);
      }, ["C4", "E4", "G4", "B4"], "4n").start(0);
      Tone.Transport.start();
      animate();
    });

    // Controls
    document.getElementById('lfoRate').addEventListener('input', e => {
      if (lfo) lfo.frequency.value = parseFloat(e.target.value);
    });
    document.getElementById('lfoDepth').addEventListener('input', e => {
      if (lfo) lfo.min = 440 - (e.target.value * 220);
      if (lfo) lfo.max = 440 + (e.target.value * 220);
    });
    document.getElementById('mutateSeq').addEventListener('click', () => {
      if (seq) seq.events = seq.events.map(n => Tone.Frequency(n).transpose(Math.floor(Math.random() * 7) - 3).toNote());
    });
    document.getElementById('randomize').addEventListener('click', () => {
      if (lfo) lfo.frequency.value = Math.random() * 10 + 0.1;
      if (lfo) lfo.min = 220 + Math.random() * 100;
      if (lfo) lfo.max = 880 + Math.random() * 100;
    });

    // Visualizer
    function animate() {
      requestAnimationFrame(animate);
      c.fillStyle = 'rgba(0,0,0,0.1)';
      c.fillRect(0,0,canvas.width,canvas.height);
      const t = Tone.now();
      const y = Math.sin(t * (lfo?.frequency.value || 1)) * 0.4 + 0.5;
      c.beginPath();
      c.arc(canvas.width * 0.5, canvas.height * y, 8, 0, Math.PI * 2);
      c.fillStyle = 'rgba(0,245,212,0.8)';
      c.fill();
    }
  </script>
</body>
</html>
